services:

  pihole-service-manager-v3:

    build: .

    container_name: pihole-service-manager-v3

    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      PIHOLE_URL: ${PIHOLE_URL}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}

    volumes:
      - ./data:/app/data
      - ./static:/app/static
      - ./templates:/app/templates
      - ./app.py:/app/app.py
      - ./catalog_update.py:/app/catalog_update.py
